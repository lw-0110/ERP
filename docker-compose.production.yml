services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: "${POSTGRES_DB:?required}"
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: "${PRODUCTION_ENV_FILE:-.env.production}"
    depends_on: { postgres: { condition: service_healthy } }
    command: ["./packages/database/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/database/prisma/schema.prisma"]
    restart: "no"
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: "${PRODUCTION_ENV_FILE:-.env.production}"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["3000:3000"]
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:3000/health/ready]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "${PUBLIC_API_URL:?required}"
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    ports: ["${WEB_HOST_PORT:-8080}:8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
